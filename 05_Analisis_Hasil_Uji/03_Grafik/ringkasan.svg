<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#203247"><text x="70" y="70" font-size="36" fill="#203247">Ringkasan hasil uji DTMF — digit 4</text><text x="70" y="115" font-size="22" fill="#203247">29 Oktober 2026 | hasil ukur, analisis rekaman, dan replay decoder</text><rect x="55" y="145" width="1390" height="82" rx="6" fill="#f0f4f8"/><text x="75" y="175" font-size="23" fill="#203247">Hasil website yang dilaporkan</text><text x="75" y="207" font-size="21" fill="#203247">Digit 4 terbaca hanya pada threshold &lt;0,01.</text><rect x="55" y="236" width="1390" height="82" rx="6" fill="#ffffff"/><text x="75" y="266" font-size="23" fill="#203247">WAV yang benar-benar diuji</text><text x="75" y="298" font-size="21" fill="#203247">65.54 ms nada aktif; 48 kHz mono; peak 0,8 full scale.</text><rect x="55" y="327" width="1390" height="82" rx="6" fill="#f0f4f8"/><text x="75" y="357" font-size="23" fill="#203247">Frekuensi dari WAV</text><text x="75" y="389" font-size="21" fill="#203247">763.6 Hz dan 1172.1 Hz; twist -2.04 dB.</text><rect x="55" y="418" width="1390" height="82" rx="6" fill="#ffffff"/><text x="75" y="448" font-size="23" fill="#203247">Frekuensi yang dicatat di workbook</text><text x="75" y="480" font-size="21" fill="#203247">769.2 Hz dan 1190 Hz; berbeda dari hasil fit CSV/WAV.</text><rect x="55" y="509" width="1390" height="82" rx="6" fill="#f0f4f8"/><text x="75" y="539" font-size="23" fill="#203247">Gain summer dari FFT workbook</text><text x="75" y="571" font-size="21" fill="#203247">Rendah 0.5754; tinggi 0.5248 V/V; nominal 0,4545.</text><rect x="55" y="600" width="1390" height="82" rx="6" fill="#ffffff"/><text x="75" y="630" font-size="23" fill="#203247">Makna threshold yang telah diverifikasi</text><text x="75" y="662" font-size="21" fill="#203247">Skor Goertzel / energi total / jumlah sampel, tanpa satuan.</text><rect x="55" y="691" width="1390" height="82" rx="6" fill="#f0f4f8"/><text x="75" y="721" font-size="23" fill="#203247">Dampak pengubahan volume</text><text x="75" y="753" font-size="21" fill="#203247">Pengali amplitudo bersama idealnya tidak mengubah skor relatif.</text><rect x="55" y="782" width="1390" height="82" rx="6" fill="#ffffff"/><text x="75" y="812" font-size="23" fill="#203247">Keterbatasan hasil deteksi</text><text x="75" y="844" font-size="21" fill="#203247">Bukan bukti lolos batas error frekuensi, twist, atau decoder standar.</text><rect x="55" y="873" width="1390" height="82" rx="6" fill="#f0f4f8"/><text x="75" y="903" font-size="23" fill="#203247">Data yang perlu dikonfirmasi</text><text x="75" y="935" font-size="21" fill="#203247">FFT rendah +4,0 vs +3,2 dB; tanda rail negatif; metode ukur resistor.</text><rect x="55" y="964" width="1390" height="82" rx="6" fill="#ffffff"/><text x="75" y="994" font-size="23" fill="#203247">Pengujian berikutnya</text><text x="75" y="1026" font-size="21" fill="#203247">Capture 0,5–1 s pada ≥20 kSa/s; simpan threshold tepat dan screenshot.</text></g></svg>